<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youth Activities</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
    <!-- Header -->
    <header class="bg-white shadow-sm">
        <div class="max-w-4xl mx-auto px-4 py-6">
            <h1 class="text-3xl font-bold text-gray-800 text-center">Youth Activities</h1>
            <p class="text-center text-gray-500 mt-1">Wednesdays at 7:00 PM</p>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 py-8">
        <!-- Loading State -->
        <div id="loading" class="text-center py-12">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-500 border-t-transparent"></div>
            <p class="mt-4 text-gray-600">Loading activities...</p>
        </div>

        <!-- Error State -->
        <div id="error" class="hidden bg-red-50 border border-red-200 rounded-lg p-6 text-center">
            <p class="text-red-600">Unable to load activities. Please check back later.</p>
        </div>

        <!-- This Week's Activity (Featured) -->
        <div id="this-week" class="hidden mb-8">
            <h2 class="text-lg font-semibold text-gray-700 mb-4 flex items-center">
                <span class="bg-green-500 text-white text-xs px-2 py-1 rounded-full mr-2">THIS WEEK</span>
            </h2>
            <div id="featured-activity" class="bg-white rounded-2xl shadow-lg overflow-hidden border-2 border-green-400">
                <!-- Filled by JavaScript -->
            </div>
        </div>

        <!-- Upcoming Activities -->
        <div id="upcoming" class="hidden">
            <h2 class="text-lg font-semibold text-gray-700 mb-4">Upcoming Activities</h2>
            <div id="activities-list" class="space-y-4">
                <!-- Filled by JavaScript -->
            </div>
        </div>

        <!-- No Activities -->
        <div id="no-activities" class="hidden text-center py-12">
            <p class="text-gray-500 text-lg">No upcoming activities scheduled.</p>
            <p class="text-gray-400 mt-2">Check back soon!</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-6 text-gray-400 text-sm">
        <p>Questions? Contact your youth leaders</p>
    </footer>

    <script>
        // CONFIGURATION - Update this with your Google Sheet ID
        const SHEET_ID = 'YOUR_GOOGLE_SHEET_ID_HERE';
        const SHEET_NAME = 'Activities';

        // Google Sheets public CSV URL
        const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${SHEET_NAME}`;

        // Parse Google Sheets JSON response
        function parseSheetData(text) {
            // Google returns JSONP-like format, extract the JSON
            const jsonStart = text.indexOf('{');
            const jsonEnd = text.lastIndexOf('}') + 1;
            const json = JSON.parse(text.substring(jsonStart, jsonEnd));

            const rows = json.table.rows;
            const cols = json.table.cols;

            // Get column headers (first row)
            const headers = cols.map(col => col.label?.toLowerCase() || '');

            // Map data to objects
            return rows.map(row => {
                const obj = {};
                row.c.forEach((cell, i) => {
                    const header = headers[i];
                    if (header) {
                        obj[header] = cell?.v || '';
                    }
                });
                return obj;
            }).filter(row => row.date); // Only return rows with a date
        }

        // Format date for display
        function formatDate(dateStr) {
            const date = new Date(dateStr);
            const options = { weekday: 'long', month: 'long', day: 'numeric' };
            return date.toLocaleDateString('en-US', options);
        }

        // Check if date is this week
        function isThisWeek(dateStr) {
            const date = new Date(dateStr);
            const today = new Date();
            const nextWeek = new Date(today);
            nextWeek.setDate(today.getDate() + 7);

            return date >= today && date < nextWeek;
        }

        // Check if date is in the future
        function isFuture(dateStr) {
            const date = new Date(dateStr);
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            return date >= today;
        }

        // Create activity card HTML
        function createActivityCard(activity, featured = false) {
            const bgClass = featured ? 'bg-gradient-to-r from-green-50 to-blue-50' : 'bg-white';

            return `
                <div class="${bgClass} ${featured ? '' : 'rounded-xl shadow-md'} p-6">
                    <div class="flex flex-col md:flex-row md:items-start md:justify-between gap-4">
                        <div class="flex-1">
                            <div class="text-sm font-medium text-blue-600 mb-1">${formatDate(activity.date)}</div>
                            <h3 class="text-xl font-bold text-gray-800 mb-2">${activity.activity || 'Activity'}</h3>
                            ${activity.theme ? `<p class="text-purple-600 text-sm font-medium mb-2">Theme: ${activity.theme}</p>` : ''}
                            <p class="text-gray-600 mb-4">${activity.description || ''}</p>

                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-sm">
                                ${activity.time ? `
                                <div class="flex items-center text-gray-500">
                                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                    </svg>
                                    ${activity.time}
                                </div>` : ''}

                                ${activity.location ? `
                                <div class="flex items-center text-gray-500">
                                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
                                    </svg>
                                    ${activity.location}
                                </div>` : ''}

                                ${activity.contact ? `
                                <div class="flex items-center text-gray-500">
                                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                                    </svg>
                                    ${activity.contact}
                                </div>` : ''}

                                ${activity['what to bring'] ? `
                                <div class="flex items-center text-orange-600 font-medium">
                                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                                    </svg>
                                    Bring: ${activity['what to bring']}
                                </div>` : ''}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Main function to load and display activities
        async function loadActivities() {
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const thisWeekSection = document.getElementById('this-week');
            const upcomingSection = document.getElementById('upcoming');
            const noActivities = document.getElementById('no-activities');
            const featuredActivity = document.getElementById('featured-activity');
            const activitiesList = document.getElementById('activities-list');

            try {
                const response = await fetch(SHEET_URL);
                const text = await response.text();
                const activities = parseSheetData(text);

                // Filter to future activities and sort by date
                const futureActivities = activities
                    .filter(a => isFuture(a.date))
                    .sort((a, b) => new Date(a.date) - new Date(b.date));

                loading.classList.add('hidden');

                if (futureActivities.length === 0) {
                    noActivities.classList.remove('hidden');
                    return;
                }

                // Find this week's activity
                const thisWeekActivity = futureActivities.find(a => isThisWeek(a.date));
                const otherActivities = futureActivities.filter(a => a !== thisWeekActivity);

                // Show this week's activity
                if (thisWeekActivity) {
                    thisWeekSection.classList.remove('hidden');
                    featuredActivity.innerHTML = createActivityCard(thisWeekActivity, true);
                }

                // Show other upcoming activities
                if (otherActivities.length > 0) {
                    upcomingSection.classList.remove('hidden');
                    activitiesList.innerHTML = otherActivities
                        .slice(0, 5) // Show max 5 upcoming
                        .map(a => createActivityCard(a))
                        .join('');
                }

            } catch (err) {
                console.error('Error loading activities:', err);
                loading.classList.add('hidden');
                error.classList.remove('hidden');
            }
        }

        // Load activities when page loads
        document.addEventListener('DOMContentLoaded', loadActivities);
    </script>
</body>
</html>
