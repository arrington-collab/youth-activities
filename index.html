<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youth Activities</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .calendar-card {
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .calendar-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
    <!-- Header -->
    <header class="bg-white shadow-sm">
        <div class="max-w-4xl mx-auto px-4 py-6">
            <h1 class="text-3xl font-bold text-gray-800 text-center">Youth Activities</h1>
            <p class="text-center text-gray-500 mt-1">Wednesdays at 7:00 PM</p>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 py-8">
        <!-- Loading State -->
        <div id="loading" class="text-center py-12">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-500 border-t-transparent"></div>
            <p class="mt-4 text-gray-600">Loading activities...</p>
        </div>

        <!-- Error State -->
        <div id="error" class="hidden bg-red-50 border border-red-200 rounded-lg p-6 text-center">
            <p class="text-red-600">Unable to load activities. Please check back later.</p>
        </div>

        <!-- This Week's Activity (Featured) -->
        <div id="this-week" class="hidden mb-8">
            <h2 class="text-lg font-semibold text-gray-700 mb-4 flex items-center">
                <span class="bg-green-500 text-white text-xs px-3 py-1 rounded-full mr-2 animate-pulse">THIS WEEK</span>
            </h2>
            <div id="featured-activity" class="bg-white rounded-2xl shadow-lg overflow-hidden border-2 border-green-400">
                <!-- Filled by JavaScript -->
            </div>
        </div>

        <!-- Calendar View -->
        <div id="calendar" class="hidden">
            <h2 class="text-lg font-semibold text-gray-700 mb-4">Upcoming Activities</h2>
            <div id="calendar-grid" class="grid gap-4">
                <!-- Filled by JavaScript -->
            </div>
        </div>

        <!-- No Activities -->
        <div id="no-activities" class="hidden text-center py-12">
            <div class="text-6xl mb-4">📅</div>
            <p class="text-gray-500 text-lg">No upcoming activities scheduled.</p>
            <p class="text-gray-400 mt-2">Check back soon!</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-6 text-gray-400 text-sm">
        <p>Questions? Contact your youth leaders</p>
    </footer>

    <script>
        // CONFIGURATION
        const SHEET_ID = '1lNGJKQ7R-ophOgRUtxeYvS6_iXheaeM9LhEYuncOr7g';
        const SHEET_NAME = 'Activities';
        const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${SHEET_NAME}`;

        // Parse Google Sheets JSON response
        function parseSheetData(text) {
            const jsonStart = text.indexOf('{');
            const jsonEnd = text.lastIndexOf('}') + 1;
            const json = JSON.parse(text.substring(jsonStart, jsonEnd));

            const rows = json.table.rows;
            const cols = json.table.cols;

            // Get column headers - keep original case for matching
            const headers = cols.map(col => col.label || '');
            console.log('Column headers:', headers);

            const results = rows.map(row => {
                const obj = {};
                row.c.forEach((cell, i) => {
                    const header = headers[i];
                    if (header) {
                        // Store with lowercase key for easy access
                        obj[header.toLowerCase()] = cell?.v || '';
                    }
                });
                return obj;
            });

            console.log('All parsed rows:', results);

            // Filter rows that have a date
            const filtered = results.filter(row => row.date);
            console.log('Filtered rows with date:', filtered);

            return filtered;
        }

        // Format date for display
        function formatDate(dateStr) {
            const date = parseDate(dateStr);
            if (!date || isNaN(date)) {
                return { weekday: '', month: '', day: '', full: '' };
            }
            return {
                weekday: date.toLocaleDateString('en-US', { weekday: 'long' }),
                month: date.toLocaleDateString('en-US', { month: 'short' }),
                day: date.getDate(),
                full: date.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' })
            };
        }

        // Check if date is this week
        function isThisWeek(dateStr) {
            const date = parseDate(dateStr);
            if (!date || isNaN(date)) return false;
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const nextWeek = new Date(today);
            nextWeek.setDate(today.getDate() + 7);
            return date >= today && date < nextWeek;
        }

        // Parse date string (handles various formats including M/D/YY)
        function parseDate(dateStr) {
            if (!dateStr) return null;

            // If it's already a Date object or timestamp
            if (dateStr instanceof Date) return dateStr;

            // Handle M/D/YY format (e.g., 2/11/26 -> 2026-02-11)
            const shortFormat = /^(\d{1,2})\/(\d{1,2})\/(\d{2})$/;
            const match = dateStr.toString().match(shortFormat);
            if (match) {
                let year = parseInt(match[3]);
                // Assume 2000s for 2-digit years
                year = year < 100 ? 2000 + year : year;
                return new Date(year, parseInt(match[1]) - 1, parseInt(match[2]));
            }

            // Try standard parsing
            return new Date(dateStr);
        }

        // Check if date is in the future
        function isFuture(dateStr) {
            const date = parseDate(dateStr);
            if (!date || isNaN(date)) return false;
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            return date >= today;
        }

        // Create featured activity card
        function createFeaturedCard(activity) {
            const date = formatDate(activity.date);
            return `
                <div class="bg-gradient-to-r from-green-50 to-blue-50 p-6">
                    <div class="flex flex-col md:flex-row gap-6">
                        <!-- Date Badge -->
                        <div class="flex-shrink-0">
                            <div class="bg-white rounded-xl shadow-md p-4 text-center w-24">
                                <div class="text-xs font-semibold text-green-600 uppercase">${date.month}</div>
                                <div class="text-3xl font-bold text-gray-800">${date.day}</div>
                                <div class="text-xs text-gray-500">${date.weekday}</div>
                            </div>
                        </div>

                        <!-- Activity Details -->
                        <div class="flex-1">
                            <h3 class="text-2xl font-bold text-gray-800 mb-2">${activity.activity || 'Activity'}</h3>
                            ${activity.theme ? `<span class="inline-block bg-purple-100 text-purple-700 text-xs font-semibold px-3 py-1 rounded-full mb-3">Theme: ${activity.theme}</span>` : ''}
                            ${activity.description ? `<p class="text-gray-600 mb-4">${activity.description}</p>` : ''}

                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-sm">
                                ${activity.time ? `
                                <div class="flex items-center text-gray-600">
                                    <svg class="w-5 h-5 mr-2 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                    </svg>
                                    ${activity.time}
                                </div>` : ''}

                                ${activity.location ? `
                                <div class="flex items-center text-gray-600">
                                    <svg class="w-5 h-5 mr-2 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
                                    </svg>
                                    ${activity.location}
                                </div>` : ''}

                                ${activity.contact ? `
                                <div class="flex items-center text-gray-600">
                                    <svg class="w-5 h-5 mr-2 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                                    </svg>
                                    ${activity.contact}
                                </div>` : ''}

                                ${activity['what to bring'] ? `
                                <div class="flex items-center text-orange-600 font-medium">
                                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                                    </svg>
                                    Bring: ${activity['what to bring']}
                                </div>` : ''}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Create calendar card
        function createCalendarCard(activity) {
            const date = formatDate(activity.date);
            return `
                <div class="calendar-card bg-white rounded-xl shadow-md overflow-hidden flex">
                    <!-- Date Column -->
                    <div class="bg-gradient-to-b from-blue-500 to-indigo-600 text-white p-4 flex flex-col items-center justify-center min-w-[80px]">
                        <div class="text-xs font-semibold uppercase opacity-80">${date.month}</div>
                        <div class="text-3xl font-bold">${date.day}</div>
                        <div class="text-xs opacity-80">${date.weekday.slice(0,3)}</div>
                    </div>

                    <!-- Content -->
                    <div class="p-4 flex-1">
                        <h3 class="font-bold text-gray-800 mb-1">${activity.activity || 'Activity'}</h3>
                        ${activity.theme ? `<span class="inline-block bg-purple-100 text-purple-700 text-xs px-2 py-0.5 rounded-full mb-2">Theme: ${activity.theme}</span>` : ''}

                        <div class="flex flex-wrap gap-3 text-sm text-gray-500 mt-2">
                            ${activity.time ? `
                            <div class="flex items-center">
                                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                </svg>
                                ${activity.time}
                            </div>` : ''}
                            ${activity.location ? `
                            <div class="flex items-center">
                                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                                </svg>
                                ${activity.location}
                            </div>` : ''}
                        </div>

                        ${activity['what to bring'] ? `
                        <div class="mt-2 text-xs text-orange-600 font-medium">
                            Bring: ${activity['what to bring']}
                        </div>` : ''}
                    </div>
                </div>
            `;
        }

        // Main function to load and display activities
        async function loadActivities() {
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const thisWeekSection = document.getElementById('this-week');
            const calendar = document.getElementById('calendar');
            const noActivities = document.getElementById('no-activities');
            const featuredActivity = document.getElementById('featured-activity');
            const calendarGrid = document.getElementById('calendar-grid');

            try {
                const response = await fetch(SHEET_URL);
                const text = await response.text();
                const activities = parseSheetData(text);

                // Debug: log what we got
                console.log('Raw activities:', activities);
                console.log('First activity:', activities[0]);

                // Filter to future activities and sort by date
                const futureActivities = activities
                    .filter(a => {
                        const hasFutureDate = isFuture(a.date);
                        console.log('Activity:', a, 'isFuture:', hasFutureDate);
                        return hasFutureDate;
                    })
                    .sort((a, b) => parseDate(a.date) - parseDate(b.date));

                loading.classList.add('hidden');

                if (futureActivities.length === 0) {
                    noActivities.classList.remove('hidden');
                    return;
                }

                // Find this week's activity
                const thisWeekActivity = futureActivities.find(a => isThisWeek(a.date));
                const otherActivities = futureActivities.filter(a => a !== thisWeekActivity);

                // Show this week's activity
                if (thisWeekActivity) {
                    thisWeekSection.classList.remove('hidden');
                    featuredActivity.innerHTML = createFeaturedCard(thisWeekActivity);
                }

                // Show calendar of upcoming activities
                if (otherActivities.length > 0) {
                    calendar.classList.remove('hidden');
                    calendarGrid.innerHTML = otherActivities
                        .slice(0, 8)
                        .map(a => createCalendarCard(a))
                        .join('');
                }

            } catch (err) {
                console.error('Error loading activities:', err);
                loading.classList.add('hidden');
                error.classList.remove('hidden');
            }
        }

        // Load activities when page loads
        document.addEventListener('DOMContentLoaded', loadActivities);

        // Refresh every 5 minutes
        setInterval(loadActivities, 5 * 60 * 1000);
    </script>
</body>
</html>
