<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Priest Quorum Activities</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'space': ['Space Grotesk', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Space Grotesk', sans-serif; }

        .gradient-bg {
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
        }

        .card-glow {
            background: linear-gradient(145deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.02) 100%);
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
        }

        .card-glow:hover {
            border-color: rgba(59, 130, 246, 0.5);
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.2);
            transform: translateY(-4px);
        }

        .featured-glow {
            background: linear-gradient(145deg, rgba(34, 197, 94, 0.1) 0%, rgba(59, 130, 246, 0.1) 100%);
            border: 2px solid rgba(34, 197, 94, 0.4);
        }

        .featured-glow:hover {
            border-color: rgba(34, 197, 94, 0.7);
            box-shadow: 0 0 40px rgba(34, 197, 94, 0.3);
        }

        .text-gradient {
            background: linear-gradient(135deg, #22c55e 0%, #3b82f6 50%, #06b6d4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .date-badge {
            background: linear-gradient(135deg, #3b82f6 0%, #0891b2 100%);
        }

        .featured-badge {
            background: linear-gradient(135deg, #22c55e 0%, #10b981 100%);
            animation: pulse-glow 2s ease-in-out infinite;
        }

        .theme-badge {
            background: rgba(6, 182, 212, 0.2);
            color: #22d3ee;
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(34, 197, 94, 0.4); }
            50% { box-shadow: 0 0 30px rgba(34, 197, 94, 0.7); }
        }

        .animate-float {
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .transition-all {
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="gradient-bg min-h-screen text-white">
    <!-- Header -->
    <header class="py-8 px-4">
        <div class="max-w-4xl mx-auto text-center">
            <h1 class="text-4xl md:text-5xl font-bold text-gradient mb-2">PRIEST QUORUM</h1>
            <p class="text-2xl md:text-3xl font-light text-gray-400 tracking-widest">ACTIVITIES</p>
            <div class="mt-4 inline-flex items-center gap-2 bg-white/5 px-4 py-2 rounded-full border border-white/10">
                <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                <span class="text-sm text-gray-400">Wednesdays @ 7:00 PM</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 pb-12">
        <!-- Loading State -->
        <div id="loading" class="text-center py-20">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-cyan-500 border-t-transparent"></div>
            <p class="mt-6 text-gray-400 text-lg">Loading...</p>
        </div>

        <!-- Error State -->
        <div id="error" class="hidden card-glow rounded-2xl p-8 text-center">
            <div class="text-5xl mb-4">⚠️</div>
            <p class="text-red-400 text-lg">Unable to load activities</p>
            <p class="text-gray-500 mt-2">Check back later</p>
        </div>

        <!-- This Week's Activity (Featured) -->
        <div id="this-week" class="hidden mb-8">
            <div class="flex items-center gap-3 mb-4">
                <span class="featured-badge text-white text-xs font-bold px-4 py-2 rounded-full uppercase tracking-wider">
                    This Week
                </span>
                <div class="flex-1 h-px bg-gradient-to-r from-green-500/50 to-transparent"></div>
            </div>
            <div id="featured-activity" class="featured-glow rounded-2xl overflow-hidden transition-all">
                <!-- Filled by JavaScript -->
            </div>
        </div>

        <!-- Upcoming Activities -->
        <div id="calendar" class="hidden">
            <div class="flex items-center gap-3 mb-6">
                <span class="text-gray-400 text-sm font-medium uppercase tracking-wider">Coming Up</span>
                <div class="flex-1 h-px bg-gradient-to-r from-white/20 to-transparent"></div>
            </div>
            <div id="calendar-grid" class="grid gap-4">
                <!-- Filled by JavaScript -->
            </div>
        </div>

        <!-- No Activities -->
        <div id="no-activities" class="hidden text-center py-20">
            <div class="text-7xl mb-6 animate-float">📅</div>
            <p class="text-gray-400 text-xl">No upcoming activities</p>
            <p class="text-gray-600 mt-2">Check back soon</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-8 border-t border-white/5">
        <p class="text-gray-600 text-sm">Questions? Hit up your priest quorum advisor</p>
    </footer>

    <script>
        // CONFIGURATION
        const SHEET_ID = '1lNGJKQ7R-ophOgRUtxeYvS6_iXheaeM9LhEYuncOr7g';
        const SHEET_NAME = 'Activities';
        const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${SHEET_NAME}`;

        // Parse date string (handles various formats including Google Sheets Date())
        function parseDate(dateStr) {
            if (!dateStr) return null;
            if (dateStr instanceof Date) return dateStr;

            const str = dateStr.toString();

            // Handle Google Sheets Date(year,month,day) format
            const googleFormat = /^Date\((\d+),(\d+),(\d+)\)$/;
            const googleMatch = str.match(googleFormat);
            if (googleMatch) {
                return new Date(
                    parseInt(googleMatch[1]),
                    parseInt(googleMatch[2]),
                    parseInt(googleMatch[3])
                );
            }

            // Handle M/D/YY format
            const shortFormat = /^(\d{1,2})\/(\d{1,2})\/(\d{2})$/;
            const shortMatch = str.match(shortFormat);
            if (shortMatch) {
                let year = parseInt(shortMatch[3]);
                year = year < 100 ? 2000 + year : year;
                return new Date(year, parseInt(shortMatch[1]) - 1, parseInt(shortMatch[2]));
            }

            return new Date(dateStr);
        }

        // Parse time from Google Sheets format
        function parseTime(timeStr) {
            if (!timeStr) return '';

            const str = timeStr.toString();

            // Handle Google Sheets Date(year,month,day,hour,min,sec) format for time
            // e.g., Date(1899,11,30,7,0,0) means 7:00 AM
            const googleTimeFormat = /^Date\(\d+,\d+,\d+,(\d+),(\d+),(\d+)\)$/;
            const googleMatch = str.match(googleTimeFormat);
            if (googleMatch) {
                let hour = parseInt(googleMatch[1]);
                const min = parseInt(googleMatch[2]);
                const ampm = hour >= 12 ? 'PM' : 'AM';
                hour = hour % 12 || 12;
                return `${hour}:${min.toString().padStart(2, '0')} ${ampm}`;
            }

            // Return as-is if it looks like a time already
            return str;
        }

        // Parse Google Sheets JSON response
        function parseSheetData(text) {
            const jsonStart = text.indexOf('{');
            const jsonEnd = text.lastIndexOf('}') + 1;
            const json = JSON.parse(text.substring(jsonStart, jsonEnd));

            const rows = json.table.rows;
            const cols = json.table.cols;
            const headers = cols.map(col => col.label || '');

            const results = rows.map(row => {
                const obj = {};
                row.c.forEach((cell, i) => {
                    const header = headers[i];
                    if (header) {
                        obj[header.toLowerCase()] = cell?.v || '';
                    }
                });
                return obj;
            });

            return results.filter(row => row.date);
        }

        // Format date for display
        function formatDate(dateStr) {
            const date = parseDate(dateStr);
            if (!date || isNaN(date)) {
                return { weekday: '', month: '', day: '', full: '' };
            }
            return {
                weekday: date.toLocaleDateString('en-US', { weekday: 'short' }).toUpperCase(),
                month: date.toLocaleDateString('en-US', { month: 'short' }).toUpperCase(),
                day: date.getDate(),
                full: date.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' })
            };
        }

        // Check if date is this week
        function isThisWeek(dateStr) {
            const date = parseDate(dateStr);
            if (!date || isNaN(date)) return false;
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const nextWeek = new Date(today);
            nextWeek.setDate(today.getDate() + 7);
            return date >= today && date < nextWeek;
        }

        // Check if date is in the future
        function isFuture(dateStr) {
            const date = parseDate(dateStr);
            if (!date || isNaN(date)) return false;
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            return date >= today;
        }

        // Create featured activity card
        function createFeaturedCard(activity) {
            const date = formatDate(activity.date);
            const time = parseTime(activity.time);
            return `
                <div class="p-6 md:p-8">
                    <div class="flex flex-col md:flex-row gap-6">
                        <!-- Date Badge -->
                        <div class="flex-shrink-0">
                            <div class="featured-badge rounded-2xl p-5 text-center min-w-[100px]">
                                <div class="text-xs font-bold opacity-80">${date.month}</div>
                                <div class="text-4xl font-bold">${date.day}</div>
                                <div class="text-xs font-medium opacity-80">${date.weekday}</div>
                            </div>
                        </div>

                        <!-- Activity Details -->
                        <div class="flex-1">
                            <h3 class="text-2xl md:text-3xl font-bold text-white mb-3">${activity.activity || 'Activity'}</h3>
                            ${activity.theme ? `<span class="inline-block theme-badge text-sm font-medium px-3 py-1 rounded-full mb-4">🎯 ${activity.theme}</span>` : ''}
                            ${activity.description ? `<p class="text-gray-400 mb-4 text-lg">${activity.description}</p>` : ''}

                            <div class="flex flex-wrap gap-4 text-sm">
                                ${time ? `
                                <div class="flex items-center gap-2 text-gray-300">
                                    <span class="text-lg">🕐</span>
                                    <span>${time}</span>
                                </div>` : ''}

                                ${activity.location ? `
                                <div class="flex items-center gap-2 text-gray-300">
                                    <span class="text-lg">📍</span>
                                    <span>${activity.location}</span>
                                </div>` : ''}

                                ${activity.contact ? `
                                <div class="flex items-center gap-2 text-gray-300">
                                    <span class="text-lg">👤</span>
                                    <span>${activity.contact}</span>
                                </div>` : ''}
                            </div>

                            ${activity['what to bring'] ? `
                            <div class="mt-4 flex items-center gap-2 text-amber-400 font-medium">
                                <span class="text-lg">🎒</span>
                                <span>Bring: ${activity['what to bring']}</span>
                            </div>` : ''}
                        </div>
                    </div>
                </div>
            `;
        }

        // Create calendar card
        function createCalendarCard(activity) {
            const date = formatDate(activity.date);
            const time = parseTime(activity.time);
            return `
                <div class="card-glow rounded-xl overflow-hidden flex transition-all cursor-default">
                    <!-- Date Column -->
                    <div class="date-badge text-white p-4 flex flex-col items-center justify-center min-w-[80px]">
                        <div class="text-xs font-bold opacity-80">${date.month}</div>
                        <div class="text-3xl font-bold">${date.day}</div>
                        <div class="text-xs opacity-80">${date.weekday}</div>
                    </div>

                    <!-- Content -->
                    <div class="p-4 flex-1">
                        <h3 class="font-bold text-white text-lg mb-1">${activity.activity || 'Activity'}</h3>
                        ${activity.theme ? `<span class="inline-block theme-badge text-xs px-2 py-0.5 rounded-full mb-2">🎯 ${activity.theme}</span>` : ''}

                        <div class="flex flex-wrap gap-3 text-sm text-gray-400 mt-2">
                            ${time ? `<span>🕐 ${time}</span>` : ''}
                            ${activity.location ? `<span>📍 ${activity.location}</span>` : ''}
                        </div>

                        ${activity['what to bring'] ? `
                        <div class="mt-2 text-xs text-amber-400">
                            🎒 Bring: ${activity['what to bring']}
                        </div>` : ''}
                    </div>
                </div>
            `;
        }

        // Main function to load and display activities
        async function loadActivities() {
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const thisWeekSection = document.getElementById('this-week');
            const calendar = document.getElementById('calendar');
            const noActivities = document.getElementById('no-activities');
            const featuredActivity = document.getElementById('featured-activity');
            const calendarGrid = document.getElementById('calendar-grid');

            try {
                const response = await fetch(SHEET_URL);
                const text = await response.text();
                const activities = parseSheetData(text);

                const futureActivities = activities
                    .filter(a => isFuture(a.date))
                    .sort((a, b) => parseDate(a.date) - parseDate(b.date));

                loading.classList.add('hidden');

                if (futureActivities.length === 0) {
                    noActivities.classList.remove('hidden');
                    return;
                }

                const thisWeekActivity = futureActivities.find(a => isThisWeek(a.date));
                const otherActivities = futureActivities.filter(a => a !== thisWeekActivity);

                if (thisWeekActivity) {
                    thisWeekSection.classList.remove('hidden');
                    featuredActivity.innerHTML = createFeaturedCard(thisWeekActivity);
                }

                if (otherActivities.length > 0) {
                    calendar.classList.remove('hidden');
                    calendarGrid.innerHTML = otherActivities
                        .slice(0, 8)
                        .map(a => createCalendarCard(a))
                        .join('');
                }

            } catch (err) {
                console.error('Error loading activities:', err);
                loading.classList.add('hidden');
                error.classList.remove('hidden');
            }
        }

        document.addEventListener('DOMContentLoaded', loadActivities);
        setInterval(loadActivities, 5 * 60 * 1000);
    </script>
</body>
</html>
